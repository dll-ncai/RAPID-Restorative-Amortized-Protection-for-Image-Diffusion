# RAPID Evaluation Pipeline Configuration
# Copy this file to config.yaml and modify paths as needed
# CLI args override config file, which overrides env vars, which overrides defaults

# General Configuration
general:
  seed: 42
  device: "cuda"
  verbose: true
  save_images: false

# Model Paths - uses HuggingFace model IDs for auto-download by default
# Override with local paths if you have models cached locally
models:
  # Stable Diffusion InstructPix2Pix (auto-downloads if not found locally)
  sd_i2p_path: "diffusers/instruct-pix2pix-78"
  sd_i2p_repo_id: "diffusers/instruct-pix2pix-78"

  # CLIP ViT-L/14 (auto-downloads if not found locally)
  clip_path: "openai/clip-vit-large-patch14"
  clip_repo_id: "openai/clip-vit-large-patch14"

  # FaceLock models (optional - only needed for facelock method)
  facelock_aligner_path: "Klingener/FaceLock-Aligner"
  facelock_fr_path: "Klingener/FaceLock-FR"
  facelock_aligner_repo_id: "Klingener/FaceLock-Aligner"
  facelock_fr_repo_id: "Klingener/FaceLock-FR"

  # RAPID/Restormer weights - REQUIRED
  # Download from: https://github.com/swz30/Restormer/releases
  rapid_weights_path: "restormer.pth"

# Dataset Configuration
dataset:
  path: "celeba-hq"
  file: "dataset.parquet"
  # HuggingFace dataset ID for auto-download (optional)
  # repo_id: "your-org/celeba-hq"
  num_eval_images: 100
  start_index: 4000

# Output Configuration
output:
  dir: "results"

# Methods to evaluate: clean, photoguard, facelock, editshield, rapid, or all
methods:
  - "all"

# Prompts for image editing evaluation
prompts:
  - "Turn the person's hair pink"
  - "Let the person turn bald"
  - "Let the person have a tattoo"
  - "Let the person wear purple makeup"
  - "Let the person grow a moustache"
  - "Turn the person into a zombie"
  - "Change the skin color to Avatar blue"
  - "Add elf-like ears"
  - "Let the person wear sunglasses"
  - "Let the person wear a police suit"

# Attack Configuration
attack:
  epsilon: 0.047  # 12/255
  num_iter: 40
  step_size: 0.02

# Image Configuration
image:
  size: 512
  batch_size: 1

# Diffusion Configuration
diffusion:
  edit_steps: 50
  guidance_scale: 7.5
  image_guidance_scale: 1.5